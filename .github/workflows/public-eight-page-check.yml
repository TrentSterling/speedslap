name: Public eight-page discovery verification

on:
  push:
    branches:
      - codex/public-eight-page-check-fcda637-20261014

permissions:
  contents: read

jobs:
  verify-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the verification revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned Playwright and Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/live-checks" --no-save --package-lock=false --ignore-scripts playwright@1.62.0
          node "$RUNNER_TEMP/live-checks/node_modules/playwright/cli.js" install --with-deps chrome
          echo "NODE_PATH=$RUNNER_TEMP/live-checks/node_modules" >> "$GITHUB_ENV"
      - name: Check public page and asset bytes in Chrome
        run: |
          timeout 540s node <<'NODE'
          'use strict';
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const { chromium } = require('playwright');
          const manifest = JSON.parse(fs.readFileSync('tests/about-manifest.json', 'utf8'));
          const origin = 'https://tront.xyz';
          const repos = ['speedslap', 'quantumvibes', 'spheres', 'vibebeats', 'vibeprime', 'shortpath', 'splitter', 'text2pdf'];
          const randomIds = ['inkride', 'tinytreads', 'tinyrise'];
          const randomHrefs = {
            inkride: '/inkride/',
            tinytreads: '/tinytreads/',
            tinyrise: '/tinyrise/'
          };
          const sha256 = bytes => crypto.createHash('sha256').update(bytes).digest('hex');

          async function get(url) {
            const response = await fetch(url, { redirect: 'follow', cache: 'no-store' });
            return { response, bytes: Buffer.from(await response.arrayBuffer()) };
          }

          async function checkPublicAssets(repo) {
            const pageUrl = origin + '/' + repo + '/';
            const page = await get(pageUrl);
            assert.equal(page.response.status, 200, pageUrl + ' status');
            assert.match(page.response.headers.get('content-type') || '', /text\/html/i, pageUrl + ' content type');
            const html = page.bytes.toString('utf8');
            assert.ok(html.includes('id="trontAbout"'), repo + ' About host present');
            assert.ok(html.includes('data-tront-discovery'), repo + ' discovery mount present');
            assert.ok(html.includes('tront-about-discovery.js'), repo + ' JS reference present');
            const jsUrl = new URL('tront-about-discovery.js', page.response.url).href;
            const cssUrl = new URL('tront-about-discovery.css', page.response.url).href;
            const [js, css] = await Promise.all([get(jsUrl), get(cssUrl)]);
            assert.equal(js.response.status, 200, repo + ' JS status');
            assert.equal(css.response.status, 200, repo + ' CSS status');
            assert.equal(sha256(js.bytes), manifest.javascriptSha256, repo + ' deployed JS SHA-256');
            assert.equal(sha256(css.bytes), manifest.cssSha256, repo + ' deployed CSS SHA-256');
            assert.ok(js.bytes.toString('utf8').includes('var RANDOM_COUNT = 1;'), repo + ' single random pick source');
            console.log('PUBLIC_ASSETS ' + JSON.stringify({
              repo,
              pageStatus: page.response.status,
              pageUrl: page.response.url,
              pageBytes: page.bytes.length,
              jsUrl,
              jsBytes: js.bytes.length,
              jsSha256: sha256(js.bytes),
              cssUrl,
              cssBytes: css.bytes.length,
              cssSha256: sha256(css.bytes)
            }));
            return page.response.url;
          }

          (async () => {
            assert.equal(manifest.sharedRevision, 'fcda637550b9237140c89f9e42465ddd1cb07bf0');
            const pageUrls = [];
            for (const repo of repos) pageUrls.push(await checkPublicAssets(repo));

            const browser = await chromium.launch({
              channel: 'chrome',
              headless: true,
              args: ['--no-sandbox']
            });
            const rendered = [];
            try {
              for (let i = 0; i < repos.length; i += 1) {
                const repo = repos[i];
                const page = await browser.newPage({
                  viewport: { width: 1440, height: 1100 },
                  reducedMotion: 'reduce'
                });
                const mp4Requests = [];
                page.on('request', request => {
                  const url = new URL(request.url());
                  if (/\/games\/media\/[^/]+\.mp4$/i.test(url.pathname)) mp4Requests.push(url.pathname + url.search);
                });
                const response = await page.goto(pageUrls[i], {
                  waitUntil: 'domcontentloaded',
                  timeout: 60000
                });
                assert.equal(response && response.status(), 200, repo + ' browser route status');
                await page.locator('.tront-discovery__card').first().waitFor({ state: 'attached', timeout: 30000 });
                const ids = await page.locator('.tront-discovery__card').evaluateAll(cards =>
                  cards.map(card => card.getAttribute('data-tront-discovery-game'))
                );
                assert.equal(ids.length, 3, repo + ' exactly three cards');
                assert.deepEqual(ids.slice(0, 2), ['craftmine', 'smear'], repo + ' fixed featured cards');
                assert.ok(randomIds.includes(ids[2]), repo + ' allowed random card');
                assert.equal(new Set(ids).size, 3, repo + ' no duplicate cards');
                await page.waitForTimeout(500);
                assert.equal(mp4Requests.length, 0, repo + ' no eager MP4 requests');
                await page.locator('[data-tront-discovery]').scrollIntoViewIfNeeded();
                await page.waitForFunction(() => {
                  const cards = Array.from(document.querySelectorAll('.tront-discovery__card'));
                  return cards.length === 3 && cards.every(card => {
                    const image = card.querySelector('.tront-discovery__poster');
                    return image && image.complete && image.naturalWidth > 0;
                  });
                }, null, { timeout: 30000 });
                const cards = await page.locator('.tront-discovery__card').evaluateAll(elements =>
                  elements.map(card => {
                    const link = card.querySelector('.tront-discovery__title a');
                    const image = card.querySelector('.tront-discovery__poster');
                    const smearVideo = card.getAttribute('data-tront-discovery-game') === 'smear'
                      ? card.querySelector('video[data-tront-discovery-video][src]')
                      : null;
                    return {
                      game: card.getAttribute('data-tront-discovery-game'),
                      href: link && link.getAttribute('href'),
                      posterWidth: image && image.naturalWidth,
                      smearHasVideo: !!smearVideo
                    };
                  })
                );
                assert.ok(cards.every(card => card.href && card.posterWidth > 0), repo + ' links and posters work');
                assert.equal(cards.find(card => card.game === 'smear').smearHasVideo, false, repo + ' SMEAR remains poster-only');
                const hrefPaths = cards.map(card => new URL(card.href, page.url()).pathname);
                assert.deepEqual(hrefPaths, ['/craftmine/', '/smear/', randomHrefs[ids[2]]], repo + ' card links are canonical');
                assert.equal(mp4Requests.length, 0, repo + ' reduced-motion stays poster-only');
                await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.locator('.tront-discovery__card').first().waitFor({ state: 'attached', timeout: 30000 });
                const reloadedIds = await page.locator('.tront-discovery__card').evaluateAll(cards =>
                  cards.map(card => card.getAttribute('data-tront-discovery-game'))
                );
                assert.deepEqual(reloadedIds, ids, repo + ' random choice is stable for the session');
                rendered.push({ repo, cards: ids, posters: cards.map(card => card.posterWidth), mp4Requests: mp4Requests.length });
                await page.close();
              }
            } finally {
              await browser.close();
            }
            console.log('PUBLIC_RENDERED_VERIFICATION ' + JSON.stringify(rendered));
          })().catch(error => {
            console.error(error && error.stack ? error.stack : error);
            process.exitCode = 1;
          });
          NODE